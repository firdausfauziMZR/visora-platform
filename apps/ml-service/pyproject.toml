[project]
name = "visora-ml-service"
version = "0.1.0"
description = "Local FastAPI face search service for Visora"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    "python-multipart>=0.0.20,<1.0",
    "qdrant-client>=1.16,<2.0",
    "pytest>=8.0,<9.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[tool.uvicorn]
factory = false
